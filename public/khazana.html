<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Khazana Info</title>
</head>
<body>
  <h2>Khazana Data Loader</h2>
  
  <button onclick="fetchKhazanaData('filters')">Filters Load Karein</button>
  <button onclick="fetchKhazanaData('teachers')">Teachers Load Karein</button>
  <button onclick="fetchKhazanaData('chapters', '123')">Chapters Load Karein</button>
  <button onclick="fetchKhazanaData('topics', '123', '456')">Topics Load Karein</button>

  <pre id="output">Data yahan dikhega...</pre>

  <script>
    async function fetchKhazanaData(type, subjectId = null, chapterId = null, programId = "1") {
      const output = document.getElementById('output');
      output.textContent = "Loading...";

      // Query String Taiyar Karein
      const params = new URLSearchParams({
        ProgramId: programId,
        Type: type,
        page: "1",
        limit: "20"
      });

      if (subjectId) params.append("SubjectId", subjectId);
      if (chapterId) params.append("ChapterId", chapterId);

      try {
        // Aapke Next.js Endpoint ko Call Karein
        const response = await fetch(`/api/khazana?${params.toString()}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Kuch galat hua");
        }

        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
