<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>StudyAura Video Player & Notes</title>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            *,*::before,*::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none
            }

            :root {
                --accent: #5a4bda;
                --bg: #000;
                --surface: #111118;
                --surface2: #1c1c27;
                --border: rgba(255,255,255,.1);
                --text: #e8e8f0;
                --muted: #7070a0;
                --note: #3ecfcf;
                --dpp: #ff9f43
            }

            html,body {
                height: 100%;
                width: 100%;
                overflow: hidden;
                background: var(--bg);
                font-family: 'DM Sans',-apple-system,sans-serif;
                color: var(--text)
            }

            #shell {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                background: var(--bg);
                overflow: hidden
            }

            #main-row {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                overflow: hidden
            }

            #video-col {
                flex: 1;
                min-width: 0;
                min-height: 0;
                position: relative;
                background: #000;
                overflow: hidden
            }

            #vid-box {
                position: absolute;
                inset: 0;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center
            }

            .ov {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                z-index: 10
            }

            #ovLoad {
                background: rgba(0,0,0,.82)
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid rgba(90,75,218,.18);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin .8s linear infinite
            }

            #ovLoad p {
                font-size: 13px;
                color: rgba(255,255,255,.65)
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg)
                }
            }
        </style>
    </head>
    <body>
        <div id="shell">
            <div id="main-row">
                <div id="video-col">
                    <div id="vid-box">
                        <video id="vid" playsinline preload="auto"></video>
                        <div class="ov" id="ovLoad">
                            <div class="spinner"></div>
                            <p id="loadMsg">Detecting Live Stream & Slugs...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function slugify(text) {
                if (!text) return '';
                return text.toString().toLowerCase()
                    .replace(/\s+/g, '-')
                    .replace(/[^\w\-]+/g, '')
                    .replace(/\-\-+/g, '-')
                    .replace(/^-+/, '')
                    .replace(/-+$/, '');
            }

            async function processScheduleDetails() {
                const urlParams = new URLSearchParams(window.location.search);

                const defaultRc = "698ad3519549b300a5e1cc6a";
                const defaultSubject = "69b5698ee506a608ee297ed1";
                const defaultPro = "6a0191586c12456e9078970e";

                const rc = urlParams.get('rc') || urlParams.get('batchId') || defaultRc;
                const subjectInput = urlParams.get('subject') || urlParams.get('subjectId') || defaultSubject;
                const pro = urlParams.get('pro') || urlParams.get('scheduleId') || defaultPro;
                const tap = urlParams.get('tap') || '';

                if (!rc || !pro) {
                    document.getElementById('loadMsg').innerText = "Missing Batch or Schedule ID!";
                    return;
                }

                // ==========================================
                // 1. NOTES SELECTION CHECK (IF TAP = NOTE)
                // ==========================================
                if (tap === 'note') {
                    document.getElementById('loadMsg').innerText = "Fetching Notes PDF Link...";
                    try {
                        // Direct Contents API call to get accurate attachment keys
                        const contentsApiUrl = `https://api.studyaura.online/api/penpencil/batch-service/v3/batch-subject-schedules/${rc}/subject/${subjectInput}/contents?skip=0&limit=50&contentType=NOTES`;
                        
                        const contentsRes = await fetch(contentsApiUrl, {
                            headers: {
                                'Content-Type': 'application/json',
                                'User-Agent': 'Mozilla/5.0'
                            }
                        });

                        if (contentsRes.ok) {
                            const contentsData = await contentsRes.json();
                            const list = contentsData.data || [];

                            // Find schedule matching current scheduleId (pro)
                            const matchedItem = list.find(item => item._id === pro || item.data?._id === pro);

                            let finalPdfUrl = "";

                            if (matchedItem) {
                                const homeworks = matchedItem.data?.homeworkIds || [];
                                for (const hw of homeworks) {
                                    const attachments = hw.attachmentIds || [];
                                    for (const att of attachments) {
                                        if (att.baseUrl && att.key) {
                                            finalPdfUrl = att.baseUrl + att.key;
                                            break;
                                        } else if (att.key) {
                                            finalPdfUrl = `https://static.pw.live/${att.key}`;
                                            break;
                                        }
                                    }
                                    if (finalPdfUrl) break;
                                }
                            }

                            // Fallback: search across all items if exact schedule match fails
                            if (!finalPdfUrl && list.length > 0) {
                                for (const item of list) {
                                    if (item._id === pro || item.data?._id === pro) {
                                        const hw = item.data?.homeworkIds?.[0];
                                        const att = hw?.attachmentIds?.[0];
                                        if (att?.baseUrl && att?.key) {
                                            finalPdfUrl = att.baseUrl + att.key;
                                            break;
                                        }
                                    }
                                }
                            }

                            if (finalPdfUrl) {
                                window.location.replace(`https://docs.google.com/viewer?url=${encodeURIComponent(finalPdfUrl)}&embedded=true`);
                                return;
                            } else {
                                document.getElementById('loadMsg').innerText = "PDF link missing for this lecture!";
                                return;
                            }
                        }
                        document.getElementById('loadMsg').innerText = "Failed to fetch notes list!";
                        return;
                    } catch (e) {
                        console.error("Notes Fetch Error:", e);
                        document.getElementById('loadMsg').innerText = "Error loading Notes PDF!";
                        return;
                    }
                }

                // ==========================================
                // 2. DEFAULT VIDEO PLAYER REDIRECT LOGIC
                // ==========================================
                let isLive = urlParams.get('live') === 'true' || urlParams.get('type') === 'live';
                let title = urlParams.get('title') || urlParams.get('t') || '';
                let topicRaw = urlParams.get('topic') || '';
                let subjectSlug = subjectInput;

                const v1ScheduleApi = `https://api.studyaura.online/api/penpencil/v1/batches/${rc}/subject/${subjectInput}/schedule/${pro}/schedule-details`;
                const v2TodaysApi = `https://api.studyaura.online/api/penpencil/v2/batches/${rc}/todays-schedule?batchId=${rc}`;

                try {
                    const [resV1, resV2] = await Promise.allSettled([
                        fetch(v1ScheduleApi),
                        fetch(v2TodaysApi)
                    ]);

                    if (resV1.status === 'fulfilled' && resV1.value.ok) {
                        const json = await resV1.value.json();
                        const data = json.data || json || {};

                        if (data.title) title = data.title;
                        else if (data.topic) title = data.topic;
                        else if (data.name) title = data.name;

                        if (data.topic) topicRaw = data.topic;
                        else if (data.topicName) topicRaw = data.topicName;

                        if (data.subjectId) {
                            if (typeof data.subjectId === 'object') {
                                subjectSlug = data.subjectId.slug || slugify(data.subjectId.name) || subjectInput;
                            }
                        }

                        const statusUpper = String(data.status || '').toUpperCase();
                        if (statusUpper === 'LIVE' || statusUpper === 'UPCOMING' || data.isLive === true || data.isLiveStream === true) {
                            isLive = true;
                        }
                    }

                    if (resV2.status === 'fulfilled' && resV2.value.ok) {
                        const json = await resV2.value.json();
                        const list = json.data || json || [];
                        if (Array.isArray(list)) {
                            const match = list.find(i => i._id === pro || i.scheduleId === pro || i.id === pro);
                            if (match) {
                                isLive = true;
                                if (match.title) title = match.title;
                                if (match.topic) topicRaw = match.topic;
                                if (match.subjectId && match.subjectId.name) {
                                    subjectSlug = slugify(match.subjectId.name);
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.warn("API check error:", e);
                }

                if (!topicRaw && title) {
                    topicRaw = title.split(':')[0].split('-')[0].trim();
                }
                if (!title && topicRaw) {
                    title = topicRaw;
                }

                const baseUrl = "https://studyaura.online/player";
                const params = new URLSearchParams();

                params.set('rc', rc);
                params.set('pro', pro);
                params.set('title', title);
                params.set('t', title);
                params.set('subject', subjectSlug || subjectInput);
                params.set('topic', topicRaw || title);
                
                if (isLive) {
                    params.set('live', 'true');
                    params.set('type', 'live');
                }

                window.location.replace(`${baseUrl}?${params.toString()}`);
            }

            processScheduleDetails();
        </script>
    </body>
</html>
