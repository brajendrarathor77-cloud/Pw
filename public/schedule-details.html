<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>StudyAura Video Player</title>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            *,*::before,*::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none
            }

            :root {
                --accent: #5a4bda;
                --live-red: #ff3b30;
                --bg: #000;
                --surface: #111118;
                --surface2: #1c1c27;
                --border: rgba(255,255,255,.1);
                --text: #e8e8f0;
                --muted: #7070a0
            }

            html,body {
                height: 100%;
                width: 100%;
                overflow: hidden;
                background: var(--bg);
                font-family: 'DM Sans',-apple-system,sans-serif;
                color: var(--text)
            }

            #shell {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                background: var(--bg);
                overflow: hidden
            }

            #main-row {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                overflow: hidden
            }

            #video-col {
                flex: 1;
                min-width: 0;
                min-height: 0;
                position: relative;
                background: #000;
                overflow: hidden
            }

            #vid-box {
                position: absolute;
                inset: 0;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center
            }

            video {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                background: #000;
                display: block;
                outline: none
            }

            .ov {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                z-index: 10
            }

            #ovLoad {
                background: rgba(0,0,0,.82)
            }

            #ovLoad.off {
                display: none
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid rgba(90,75,218,.18);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin .8s linear infinite
            }

            #ovLoad p {
                font-size: 13px;
                color: rgba(255,255,255,.65)
            }

            /* Live Player UI Styles */
            #player-header {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 12px 14px;
                background: linear-gradient(rgba(0,0,0,.8) 0%,transparent 100%);
                z-index: 30
            }

            #player-title {
                flex: 1;
                min-width: 0;
                font-size: 14px;
                font-weight: 500;
                color: #fff;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis
            }

            .live-badge {
                display: none;
                align-items: center;
                gap: 6px;
                font-size: 11px;
                font-weight: 700;
                color: #fff;
                background: rgba(255, 59, 48, 0.2);
                border: 1px solid var(--live-red);
                padding: 3px 8px;
                border-radius: 6px;
                cursor: pointer;
                text-transform: uppercase;
                letter-spacing: 0.5px
            }

            .live-badge.on {
                display: inline-flex
            }

            .live-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--live-red);
                animation: blink 1.2s ease infinite
            }

            #player-footer {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 30;
                background: linear-gradient(transparent 0%,rgba(0,0,0,.85) 100%);
                padding: 10px 14px
            }

            .time-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 6px
            }

            .t-time {
                color: #fff;
                font-size: 13px;
                font-family: monospace;
                font-weight: 500
            }

            /* Live Progress Bar Adjustments */
            body.is-live-mode .bar-fill {
                background: var(--live-red) !important;
            }

            @keyframes blink {
                0%, 100% { opacity: 1; transform: scale(1); }
                50% { opacity: 0.3; transform: scale(0.85); }
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </head>
    <body>
        <div id="shell">
            <div id="main-row">
                <div id="video-col">
                    <div id="vid-box">
                        <video id="vid" playsinline preload="auto"></video>
                        
                        <!-- Dynamic Header -->
                        <div id="player-header">
                            <span id="player-title">Loading Lecture...</span>
                            <div class="live-badge" id="liveTag" onclick="jumpToLiveEdge()">
                                <span class="live-dot"></span>
                                <span>LIVE</span>
                            </div>
                        </div>

                        <!-- Loader Overlay -->
                        <div class="ov" id="ovLoad">
                            <div class="spinner"></div>
                            <p id="loadMsg">Connecting to Stream...</p>
                        </div>

                        <!-- Player Footer Controls -->
                        <div id="player-footer">
                            <div class="time-row">
                                <span class="t-time" id="timeDisplay">00:00 / 00:00</span>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <script>
            let hlsPlayer = null;

            // 1. Live vs Recorded Redirect Link Builder
            function buildPlayerUrl(options) {
                const baseUrl = "https://studyaura.online/player";
                const params = new URLSearchParams();

                if (options.rc) params.set('rc', options.rc);
                if (options.pro) params.set('pro', options.pro);
                if (options.title) params.set('title', options.title);
                if (options.subject) params.set('subject', options.subject);

                if (options.isLive) {
                    if (options.topic) params.set('topic', options.topic);
                    params.set('live', 'true');
                    params.set('type', 'live');
                }

                return `${baseUrl}?${params.toString()}`;
            }

            // 2. Sync UI Features according to Mode
            function setupPlayerMode() {
                const currentParams = new URLSearchParams(window.location.search);
                const isLive = currentParams.get('live') === 'true' || currentParams.get('type') === 'live';
                
                // Display Title
                const rawTitle = currentParams.get('title') || 'StudyAura Lecture';
                const titleEl = document.getElementById('player-title');
                if (titleEl) {
                    titleEl.textContent = decodeURIComponent(rawTitle.replace(/\+/g, ' '));
                }

                // If Live Mode is active, enable Live UI components
                if (isLive) {
                    document.body.classList.add('is-live-mode');
                    
                    const liveBadge = document.getElementById('liveTag');
                    if (liveBadge) liveBadge.classList.add('on');

                    const loadMsg = document.getElementById('loadMsg');
                    if (loadMsg) loadMsg.textContent = 'Connecting to Live Broadcast...';

                    const timeDisplay = document.getElementById('timeDisplay');
                    if (timeDisplay) timeDisplay.textContent = '● LIVE Stream';
                }
            }

            // Jump directly to the latest live edge if user lags behind
            function jumpToLiveEdge() {
                const vid = document.getElementById('vid');
                if (vid && vid.seekable.length > 0) {
                    vid.currentTime = vid.seekable.end(vid.seekable.length - 1);
                }
            }

            // 3. Auto-Redirect Execution
            (function init() {
                const currentParams = new URLSearchParams(window.location.search);

                const batchId = currentParams.get('batchId') || currentParams.get('rc');
                const scheduleId = currentParams.get('scheduleId') || currentParams.get('pro');
                const subjectId = currentParams.get('subjectId') || currentParams.get('subject');
                const title = currentParams.get('title') || document.title;
                const topic = currentParams.get('topic');
                const isLive = currentParams.get('live') === 'true' || currentParams.get('type') === 'live';

                // Check if running directly on player domain or needs redirect
                if (window.location.hostname !== 'studyaura.online' && batchId && scheduleId) {
                    const targetUrl = buildPlayerUrl({
                        rc: batchId,
                        pro: scheduleId,
                        subject: subjectId,
                        title: title,
                        topic: topic,
                        isLive: isLive
                    });
                    window.location.replace(targetUrl);
                    return;
                }

                // Setup Mode UI if already on player
                setupPlayerMode();
            })();
        </script>
    </body>
</html>
