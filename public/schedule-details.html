<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>StudyAura Details & Notes</title>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            *,*::before,*::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none
            }

            :root {
                --accent: #5a4bda;
                --bg: #000;
                --surface: #111118;
                --surface2: #1c1c27;
                --border: rgba(255,255,255,.1);
                --text: #e8e8f0;
                --muted: #7070a0;
                --note: #3ecfcf;
                --dpp: #ff9f43
            }

            html,body {
                height: 100%;
                width: 100%;
                overflow: hidden;
                background: var(--bg);
                font-family: 'DM Sans',-apple-system,sans-serif;
                color: var(--text)
            }

            #shell {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                background: var(--bg);
                overflow: hidden
            }

            #main-row {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                overflow: hidden
            }

            #video-col {
                flex: 1;
                min-width: 0;
                min-height: 0;
                position: relative;
                background: #000;
                overflow: hidden
            }

            #vid-box {
                position: absolute;
                inset: 0;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center
            }

            .ov {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                z-index: 10
            }

            #ovLoad {
                background: rgba(0,0,0,.82)
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid rgba(90,75,218,.18);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin .8s linear infinite
            }

            #ovLoad p {
                font-size: 13px;
                color: rgba(255,255,255,.65);
                text-align: center;
                padding: 0 15px;
            }

            #pdf-frame {
                width: 100%;
                height: 100%;
                border: none;
                display: none;
                background: #ffffff;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg)
                }
            }
        </style>
    </head>
    <body>
        <div id="shell">
            <div id="main-row">
                <div id="video-col">
                    <div id="vid-box">
                        <video id="vid" playsinline preload="auto"></video>
                        <iframe id="pdf-frame" title="Notes Viewer"></iframe>
                        <div class="ov" id="ovLoad">
                            <div class="spinner"></div>
                            <p id="loadMsg">Detecting Stream / Notes...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function slugify(text) {
                if (!text) return '';
                return text.toString().toLowerCase()
                    .replace(/\s+/g, '-')
                    .replace(/[^\w\-]+/g, '')
                    .replace(/\-\-+/g, '-')
                    .replace(/^-+/, '')
                    .replace(/-+$/, '');
            }

            // Deep search helper to find any valid PDF URL or Object inside API response
            function extractPdfUrlDeep(data, noteIndex = 0, isDpp = false) {
                if (!data) return null;

                let allPdfs = [];

                function traverse(obj) {
                    if (!obj) return;

                    if (typeof obj === 'string') {
                        if (obj.startsWith('http') && (obj.includes('.pdf') || obj.includes('pdf') || obj.includes('penpencil'))) {
                            allPdfs.push(obj);
                        }
                        return;
                    }

                    if (typeof obj === 'object') {
                        // Check if object has baseUrl + key
                        if (obj.baseUrl && obj.key) {
                            allPdfs.push(obj.baseUrl + obj.key);
                        }
                        // Check standard URL fields
                        if (obj.attachmentUrl) allPdfs.push(obj.attachmentUrl);
                        if (obj.solutionPath) allPdfs.push(obj.solutionPath);
                        if (obj.pdfUrl) allPdfs.push(obj.pdfUrl);
                        if (obj.fileUrl) allPdfs.push(obj.fileUrl);
                        if (obj.url && typeof obj.url === 'string' && obj.url.startsWith('http')) {
                            allPdfs.push(obj.url);
                        }

                        // Recursively check array/object properties
                        for (let key in obj) {
                            if (Object.prototype.hasOwnProperty.call(obj, key)) {
                                if (isDpp && (key.toLowerCase().includes('dpp') || key.toLowerCase().includes('homework'))) {
                                    traverse(obj[key]);
                                } else if (!isDpp && !key.toLowerCase().includes('dpp')) {
                                    traverse(obj[key]);
                                } else {
                                    traverse(obj[key]);
                                }
                            }
                        }
                    }
                }

                traverse(data);

                // Filter out duplicates and empty strings
                allPdfs = [...new Set(allPdfs)].filter(url => typeof url === 'string' && url.startsWith('http'));

                if (allPdfs.length > 0) {
                    return allPdfs[noteIndex] || allPdfs[0];
                }

                return null;
            }

            async function processScheduleDetails() {
                const urlParams = new URLSearchParams(window.location.search);

                const defaultRc = "698ad3519549b300a5e1cc6a";
                const defaultSubject = "69b569aeeffdf9567d75f816";
                const defaultPro = "6a0191586c12456e9078970e";

                const rc = urlParams.get('rc') || urlParams.get('batchId') || defaultRc;
                const subjectInput = urlParams.get('subject') || urlParams.get('subjectId') || defaultSubject;
                const pro = urlParams.get('pro') || urlParams.get('scheduleId') || defaultPro;

                const tap = urlParams.get('tap');
                const noteIndex = parseInt(urlParams.get('noteIndex') || '0', 10);
                const isDpp = urlParams.get('isDpp') === 'true';

                if (!rc || !pro) {
                    document.getElementById('loadMsg').innerText = "Missing Batch or Schedule ID!";
                    return;
                }

                let isLive = urlParams.get('live') === 'true' || urlParams.get('type') === 'live';
                let title = urlParams.get('title') || urlParams.get('t') || '';
                let topicRaw = urlParams.get('topic') || '';
                let subjectSlug = subjectInput;

                const v1ScheduleApi = `https://api.studyaura.online/api/penpencil/v1/batches/${rc}/subject/${subjectInput}/schedule/${pro}/schedule-details`;
                const v2TodaysApi = `https://api.studyaura.online/api/penpencil/v2/batches/${rc}/todays-schedule?batchId=${rc}`;

                let apiData = null;

                try {
                    const [resV1, resV2] = await Promise.allSettled([
                        fetch(v1ScheduleApi),
                        fetch(v2TodaysApi)
                    ]);

                    // 1. Fetch from V1 API
                    if (resV1.status === 'fulfilled' && resV1.value.ok) {
                        const json = await resV1.value.json();
                        apiData = json.data || json || {};

                        if (apiData.title) title = apiData.title;
                        else if (apiData.topic) title = apiData.topic;
                        else if (apiData.name) title = apiData.name;

                        if (apiData.topic) topicRaw = apiData.topic;
                        else if (apiData.topicName) topicRaw = apiData.topicName;

                        if (apiData.subjectId) {
                            if (typeof apiData.subjectId === 'object') {
                                subjectSlug = apiData.subjectId.slug || slugify(apiData.subjectId.name) || subjectInput;
                            }
                        }

                        const statusUpper = String(apiData.status || '').toUpperCase();
                        if (statusUpper === 'LIVE' || statusUpper === 'UPCOMING' || apiData.isLive === true || apiData.isLiveStream === true) {
                            isLive = true;
                        }
                    }

                    // 2. Fetch from V2 API
                    if (resV2.status === 'fulfilled' && resV2.value.ok) {
                        const json = await resV2.value.json();
                        const list = json.data || json || [];
                        if (Array.isArray(list)) {
                            const match = list.find(i => i._id === pro || i.scheduleId === pro || i.id === pro);
                            if (match) {
                                isLive = true;
                                if (match.title) title = match.title;
                                if (match.topic) topicRaw = match.topic;
                                if (match.subjectId && match.subjectId.name) {
                                    subjectSlug = slugify(match.subjectId.name);
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.warn("API check error:", e);
                }

                // Check if user is trying to open notes/PDF
                if (tap === 'note' || tap === 'pdf' || urlParams.has('noteIndex')) {
                    const pdfUrl = extractPdfUrlDeep(apiData, noteIndex, isDpp);
                    
                    if (pdfUrl) {
                        document.getElementById('ovLoad').style.display = 'none';
                        document.getElementById('vid').style.display = 'none';
                        
                        const pdfFrame = document.getElementById('pdf-frame');
                        pdfFrame.style.display = 'block';
                        
                        // Direct redirection or rendering inside viewer
                        const viewerUrl = `https://docs.google.com/gview?embedded=true&url=${encodeURIComponent(pdfUrl)}`;
                        pdfFrame.src = viewerUrl;
                        return;
                    } else {
                        document.getElementById('loadMsg').innerText = "Notes / PDF link not found in API response!";
                        return;
                    }
                }

                // Fallback parsing if topic or title missing
                if (!topicRaw && title) {
                    topicRaw = title.split(':')[0].split('-')[0].trim();
                }
                if (!title && topicRaw) {
                    title = topicRaw;
                }

                const baseUrl = "https://studyaura.online/player";
                const params = new URLSearchParams();

                params.set('rc', rc);
                params.set('pro', pro);
                params.set('title', title);
                params.set('t', title);
                params.set('subject', subjectSlug || subjectInput);
                params.set('topic', topicRaw || title);
                
                if (isLive) {
                    params.set('live', 'true');
                    params.set('type', 'live');
                }

                window.location.replace(`${baseUrl}?${params.toString()}`);
            }

            processScheduleDetails();
        </script>
    </body>
</html>
