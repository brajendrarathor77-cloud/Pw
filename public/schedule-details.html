<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
        <title>StudyAura Details & Notes</title>
        <!-- Mozilla PDF.js Library for Direct Auto Rendering -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            *,*::before,*::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }

            :root {
                --accent: #5a4bda;
                --bg: #ffffff;
                --text: #1c1c27;
            }

            html, body {
                height: 100%;
                width: 100%;
                background: #ffffff !important;
                font-family: 'DM Sans', -apple-system, sans-serif;
                color: var(--text);
                overflow-x: hidden;
                overflow-y: auto;
            }

            #shell {
                min-height: 100vh;
                width: 100%;
                background: #ffffff !important;
                display: flex;
                flex-direction: column;
            }

            #pdf-container {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                background: #ffffff !important;
                padding: 10px 0;
            }

            .pdf-page-canvas {
                width: 100% !important;
                max-width: 100%;
                height: auto !important;
                margin-bottom: 12px;
                background: #ffffff !important;
                box-shadow: 0 2px 8px rgba(0,0,0,0.05);
                /* Dark PDF background ko clean white theme me convert karne ke liye */
                filter: invert(0.92) hue-rotate(180deg) contrast(1.1);
                -webkit-filter: invert(0.92) hue-rotate(180deg) contrast(1.1);
            }

            .ov {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                z-index: 100;
                background: #ffffff !important;
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid rgba(90, 75, 218, 0.18);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }

            #loadMsg {
                font-size: 14px;
                color: #555;
                text-align: center;
                padding: 0 15px;
                font-weight: 500;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </head>
    <body>
        <div id="shell">
            <div id="pdf-container"></div>
            <div class="ov" id="ovLoad">
                <div class="spinner"></div>
                <p id="loadMsg">Notes Load Ho Rahe Hain...</p>
            </div>
        </div>

        <script>
            // Set PDF.js Worker path
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            function slugify(text) {
                if (!text) return '';
                return text.toString().toLowerCase()
                    .replace(/\s+/g, '-')
                    .replace(/[^\w\-]+/g, '')
                    .replace(/\-\-+/g, '-')
                    .replace(/^-+/, '')
                    .replace(/-+$/, '');
            }

            function extractPdfUrlDeep(data, noteIndex = 0, isDpp = false) {
                if (!data) return null;
                let allPdfs = [];

                function traverse(obj) {
                    if (!obj) return;

                    if (typeof obj === 'string') {
                        if (obj.startsWith('http') && (obj.includes('.pdf') || obj.includes('pdf') || obj.includes('penpencil'))) {
                            allPdfs.push(obj);
                        }
                        return;
                    }

                    if (typeof obj === 'object') {
                        if (obj.baseUrl && obj.key) allPdfs.push(obj.baseUrl + obj.key);
                        if (obj.attachmentUrl) allPdfs.push(obj.attachmentUrl);
                        if (obj.solutionPath) allPdfs.push(obj.solutionPath);
                        if (obj.pdfUrl) allPdfs.push(obj.pdfUrl);
                        if (obj.fileUrl) allPdfs.push(obj.fileUrl);
                        if (obj.url && typeof obj.url === 'string' && obj.url.startsWith('http')) {
                            allPdfs.push(obj.url);
                        }

                        for (let key in obj) {
                            if (Object.prototype.hasOwnProperty.call(obj, key)) {
                                if (isDpp && (key.toLowerCase().includes('dpp') || key.toLowerCase().includes('homework'))) {
                                    traverse(obj[key]);
                                } else if (!isDpp && !key.toLowerCase().includes('dpp')) {
                                    traverse(obj[key]);
                                } else {
                                    traverse(obj[key]);
                                }
                            }
                        }
                    }
                }

                traverse(data);
                allPdfs = [...new Set(allPdfs)].filter(url => typeof url === 'string' && url.startsWith('http'));

                if (allPdfs.length > 0) {
                    return allPdfs[noteIndex] || allPdfs[0];
                }
                return null;
            }

            async function renderPdfAuto(pdfUrl) {
                const container = document.getElementById('pdf-container');
                const loadOv = document.getElementById('ovLoad');

                try {
                    const loadingTask = pdfjsLib.getDocument(pdfUrl);
                    const pdf = await loadingTask.promise;

                    // Hide Loader when PDF starts rendering
                    if (loadOv) loadOv.style.display = 'none';

                    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        const viewport = page.getViewport({ scale: 1.5 });

                        const canvas = document.createElement('canvas');
                        canvas.className = 'pdf-page-canvas';
                        const context = canvas.getContext('2d');

                        canvas.height = viewport.height;
                        canvas.width = viewport.width;

                        container.appendChild(canvas);

                        await page.render({
                            canvasContext: context,
                            viewport: viewport
                        }).promise;
                    }
                } catch (err) {
                    console.error("PDF Render Error:", err);
                    // Fallback iframe in case of CORS restriction
                    container.innerHTML = `<iframe src="https://docs.google.com/gview?embedded=true&url=${encodeURIComponent(pdfUrl)}" style="width:100%; height:100vh; border:none;"></iframe>`;
                    if (loadOv) loadOv.style.display = 'none';
                }
            }

            async function processScheduleDetails() {
                const urlParams = new URLSearchParams(window.location.search);

                const defaultRc = "698ad3519549b300a5e1cc6a";
                const defaultSubject = "69b569aeeffdf9567d75f816";
                const defaultPro = "6a0191586c12456e9078970e";

                const rc = urlParams.get('rc') || urlParams.get('batchId') || defaultRc;
                const subjectInput = urlParams.get('subject') || urlParams.get('subjectId') || defaultSubject;
                const pro = urlParams.get('pro') || urlParams.get('scheduleId') || defaultPro;

                const tap = urlParams.get('tap');
                const noteIndex = parseInt(urlParams.get('noteIndex') || '0', 10);
                const isDpp = urlParams.get('isDpp') === 'true';

                if (!rc || !pro) {
                    document.getElementById('loadMsg').innerText = "Missing Batch or Schedule ID!";
                    return;
                }

                let isLive = urlParams.get('live') === 'true' || urlParams.get('type') === 'live';
                let title = urlParams.get('title') || urlParams.get('t') || '';
                let topicRaw = urlParams.get('topic') || '';
                let subjectSlug = subjectInput;

                const v1ScheduleApi = `https://api.studyaura.online/api/penpencil/v1/batches/${rc}/subject/${subjectInput}/schedule/${pro}/schedule-details`;
                const v2TodaysApi = `https://api.studyaura.online/api/penpencil/v2/batches/${rc}/todays-schedule?batchId=${rc}`;

                let apiData = null;

                try {
                    const [resV1, resV2] = await Promise.allSettled([
                        fetch(v1ScheduleApi),
                        fetch(v2TodaysApi)
                    ]);

                    if (resV1.status === 'fulfilled' && resV1.value.ok) {
                        const json = await resV1.value.json();
                        apiData = json.data || json || {};

                        if (apiData.title) title = apiData.title;
                        else if (apiData.topic) title = apiData.topic;
                        else if (apiData.name) title = apiData.name;

                        if (apiData.topic) topicRaw = apiData.topic;
                        else if (apiData.topicName) topicRaw = apiData.topicName;

                        if (apiData.subjectId && typeof apiData.subjectId === 'object') {
                            subjectSlug = apiData.subjectId.slug || slugify(apiData.subjectId.name) || subjectInput;
                        }

                        const statusUpper = String(apiData.status || '').toUpperCase();
                        if (statusUpper === 'LIVE' || statusUpper === 'UPCOMING' || apiData.isLive === true || apiData.isLiveStream === true) {
                            isLive = true;
                        }
                    }

                    if (resV2.status === 'fulfilled' && resV2.value.ok) {
                        const json = await resV2.value.json();
                        const list = json.data || json || [];
                        if (Array.isArray(list)) {
                            const match = list.find(i => i._id === pro || i.scheduleId === pro || i.id === pro);
                            if (match) {
                                isLive = true;
                                if (match.title) title = match.title;
                                if (match.topic) topicRaw = match.topic;
                                if (match.subjectId && match.subjectId.name) {
                                    subjectSlug = slugify(match.subjectId.name);
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.warn("API check error:", e);
                }

                if (tap === 'note' || tap === 'pdf' || urlParams.has('noteIndex')) {
                    const pdfUrl = extractPdfUrlDeep(apiData, noteIndex, isDpp);
                    if (pdfUrl) {
                        renderPdfAuto(pdfUrl);
                        return;
                    } else {
                        document.getElementById('loadMsg').innerText = "Notes / PDF link missing!";
                        return;
                    }
                }

                if (!topicRaw && title) topicRaw = title.split(':')[0].split('-')[0].trim();
                if (!title && topicRaw) title = topicRaw;

                const baseUrl = "https://studyaura.online/player";
                const params = new URLSearchParams();
                params.set('rc', rc);
                params.set('pro', pro);
                params.set('title', title);
                params.set('t', title);
                params.set('subject', subjectSlug || subjectInput);
                params.set('topic', topicRaw || title);

                if (isLive) {
                    params.set('live', 'true');
                    params.set('type', 'live');
                }

                window.location.replace(`${baseUrl}?${params.toString()}`);
            }

            processScheduleDetails();
        </script>
    </body>
</html>
